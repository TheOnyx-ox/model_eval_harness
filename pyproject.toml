[project]
name = "model-eval-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "TheOnyx-ox", email = "mljeko44@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "fastparquet>=2026.9.0",
    "langchain>=1.4.7",
    "langchain-google-genai>=4.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.17",
    "matplotlib>=3.11.2",
    "openai>=3.37.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[project.scripts]
model-eval-harness = "model_eval_harness:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
